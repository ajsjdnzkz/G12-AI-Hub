<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics II — Lectures</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #07111f;
      color: #f8fafc;
      min-height: 100vh;
    }
    .container {
      width: min(900px, calc(100% - 30px));
      margin: auto;
      padding: 45px 0;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    .subtitle {
      margin: 0;
      color: #94a3b8;
      font-size: 15px;
    }
    .cards {
      display: grid;
      gap: 16px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
      background: #0d1b2a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 20px;
      transition: .2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
      background: #102238;
    }
    .file-icon {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #172554;
      font-size: 25px;
    }
    .info {
      flex: 1;
    }
    .subject {
      color: #60a5fa;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
    }
    .open {
      color: #93c5fd;
      font-size: 14px;
      white-space: nowrap;
    }
    footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 28px;
    }
    @media (max-width: 600px) {
      .container { padding: 30px 0; }
      h1 { font-size: 25px; }
      .card { padding: 16px; }
      .open { display: none; }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <div class="icon">📚</div>
      <h1>Physics II</h1>
      <p class="subtitle">المحاضرات والملفات الدراسية</p>
    </header>

    <section class="cards">

      <a class="card" href="electric-force-assignment.pdf" target="_blank" rel="noopener noreferrer">
        <div class="file-icon">📄</div>
        <div class="info">
          <div class="subject">Physics II — PHY 211</div>
          <div class="title">Electric Force — Assignment (1)</div>
        </div>
        <div class="open">فتح الملف ↗</div>
      </a>

      <a class="card" href="ohms-law-lab.pdf" target="_blank" rel="noopener noreferrer">
        <div class="file-icon">⚡</div>
        <div class="info">
          <div class="subject">Physics II Lab</div>
          <div class="title">Ohm's Law</div>
        </div>
        <div class="open">فتح الملف ↗</div>
      </a>

    </section>

    <footer>NMU • Physics II</footer>
  </main>
</body>
</html>
